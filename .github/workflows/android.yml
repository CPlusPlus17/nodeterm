name: Android

# The Android companion (android/): the pure-Kotlin protocol module, tested against this repo's own
# desktop host code, and the Compose app built against the Android SDK the runner ships.
#
# The path filters below (the same list for push and pull_request) are the inputs of what this workflow
# runs, derived from the interop fixture's esbuild metafile rather than guessed (audit A63). The first
# filter listed only android/**, src/main/remote/** and src/main/pairing-*.ts, which missed 35 of the 49
# desktop sources bundled into the fixture on 2026-09-26 (all 13 from src/core, all 21 from src/shared,
# and src/main/windows-ssh-keys.ts), so a change to one ran no Android test. Each entry and why:
#   android/**            the Kotlin modules, the fixture and its bundler, the app sources tests read
#   src/core/**           bundled (pending-approvals, project-kanban-write, agent-status-mirror, and
#                         since A64 projects-list-blob + workspace-store, which build the projects.list
#                         blob, ...); also ack-sweep behind ~/.nodeterm/acks, which is not bundled
#   src/shared/**         bundled (types, agents/*, kanban-labels, ssh, ...); also pair-qr.ts (the
#                         pairing QR envelope) and agents/pane.ts (read by ResumeOfferTest)
#   src/main/*.ts         bundled: pairing-core, pairing-service, windows-ssh-keys; also index.ts, which
#                         names the projects.list blob's sources and wires the relay verbs
#   src/main/remote/**    bundled: host-service, connectHostSession and the relay/E2EE code under it
#   tsconfig.json         esbuild applies its compilerOptions to every bundled file (the root one; it
#                         does not follow the references to tsconfig.node.json, so that file is absent:
#                         the fixture's type check runs in ci.yml, which has no path filter)
#   package.json, package-lock.json   `npm ci` installs esbuild, ws and tweetnacl from them
#   .github/workflows/android.yml     this file
#   .github/workflows/security.yml, .github/dependabot.yml   GradleCiCoverageTest (android/protocol)
#                         reads them: the Kotlin CodeQL job and the Gradle Dependabot entry (audit A69)
#   docs/android.md, docs/android-audit-2026-09.md   DeviceChecklistDocsTest reads them: the device
#                         checklist and the audit ids its items name (audit A65)
#   CONTRIBUTING.md       ContributorDocsTest reads it (with docs/android.md and the two READMEs under
#                         android/): the JDK range and the `npm ci --ignore-scripts` warning (A61, A71)
#   src/renderer/components/settings/sections/PhoneSection.tsx   DeviceChecklistDocsTest reads the
#                         label of its JSON -> link QR switch, which the camera-app pairing check names
# To re-derive: `node android/protocol/src/test/interop/bundle-fixture.cjs <out.cjs>
# android/protocol/src/test/interop/electron-stub.ts` from the repo root writes <out.cjs>.meta.json,
# whose `inputs` are the bundled files. WorkflowPathFilterTest (android/protocol) fails when one is not
# matched by both filters. A change that adds an input edits a file that is already one (or the bundler
# or tsconfig.json), so it runs this workflow and that test. The same test fails on a repo file a
# protocol test reads by a literal path (from InteropHarness.repoRoot or a val bound to it) that the
# filters miss, and on a read by a computed path it has not been told about.
on:
  push:
    paths:
      - 'android/**'
      - 'src/core/**'
      - 'src/shared/**'
      - 'src/main/*.ts'
      - 'src/main/remote/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
      - 'docs/android.md'
      - 'docs/android-audit-2026-09.md'
      - 'CONTRIBUTING.md'
      - 'src/renderer/components/settings/sections/PhoneSection.tsx'
  pull_request:
    paths:
      - 'android/**'
      - 'src/core/**'
      - 'src/shared/**'
      - 'src/main/*.ts'
      - 'src/main/remote/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
      - 'docs/android.md'
      - 'docs/android-audit-2026-09.md'
      - 'CONTRIBUTING.md'
      - 'src/renderer/components/settings/sections/PhoneSection.tsx'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job runs gradle/actions/setup-gradle before ./gradlew (audit A69). It checks the committed
# android/gradle/wrapper/gradle-wrapper.jar against Gradle's published wrapper checksums, so a jar that
# is not a released Gradle wrapper fails the job instead of running, and it caches ~/.gradle (the wrapper's Gradle distribution, AGP
# and the dependencies), which every run used to download again. The cache is the MIT-licensed `basic`
# provider (a thin wrapper over actions/cache), not the action's default `enhanced` one: that is the
# closed-source gradle-actions-caching library under the Gradle Technologies Terms of Use, and using it
# accepts those terms for this repository, which is the owner's call (switching is this one input).
# The basic provider uses ONE key for every job, setup-java-<os>-<arch>-gradle-<hash of **/*.gradle*
# and gradle-wrapper.properties>, shared with security.yml's CodeQL (Kotlin) job, and the first job to
# save a key keeps it. So exactly one job writes it: `app`, which resolves the most (AGP, the app's and
# the protocol module's dependencies, the Gradle distribution), and only on the default branch (the
# action's own default; a pull request never writes). The others read it with cache-read-only and
# download what only they use. GradleCiCoverageTest (android/protocol) pins the validation step and the
# single writer.
jobs:
  protocol:
    name: Protocol (JVM + desktop interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The interop tests run the desktop's relay host / pairing code through esbuild + node. They
      # need tweetnacl, ws and esbuild, not a rebuilt node-pty, hence no scripts. They do not need
      # Electron either: InteropHarness aliases `electron` to a stub
      # (android/protocol/src/test/interop/electron-stub.ts), because the real package's first
      # `require` downloads the ~110 MB Electron binary when it is not there yet, as on a fresh
      # runner, inside the harness's 20 s ready wait (audit A60).
      - name: Install desktop dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: tmux (SSH transport tests run a real, sandboxed tmux)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Protocol tests
        working-directory: android
        run: ./gradlew -p protocol test --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: protocol-test-report
          path: android/protocol/build/reports/tests/test

  app:
    name: App (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The one job that writes the shared Gradle cache (see the note above `jobs:`).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nodeterm-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # R8 runs only for the release build type, and the debug APK above is the one distributed. Building
  # the release here (unsigned; no signing secrets exist or are needed) makes a missing -dontwarn in
  # app/proguard-rules.pro fail CI instead of the first real release (audit A37): R8 reports the missing
  # class. It reports no missing -keep, so tools/check-r8-output.sh then checks that the keeps it names
  # matched (the WebView bridge, the worker, BouncyCastle's provider tables, one exception name). A NEW
  # reflection target without a keep is not detected: it needs its own keep and a line in that script.
  # A separate job so an R8 failure never withholds the debug APK. Green does not prove reflection-loaded
  # code works on a phone.
  app-release:
    name: App release (R8, unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Build release APK (R8)
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Check the R8 keeps matched
        working-directory: android
        run: sh tools/check-r8-output.sh app/build/outputs/mapping/release

      # On a missing-class failure R8 writes the -dontwarn lines it wanted to missing_rules.txt here.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-release-outputs
          path: android/app/build/outputs/mapping/release
          if-no-files-found: ignore
