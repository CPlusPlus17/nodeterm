name: Android

# The Android companion (android/): the pure-Kotlin protocol module, tested against this repo's own
# desktop host code, and the Compose app built against the Android SDK the runner ships.
on:
  push:
    paths:
      - 'android/**'
      - 'src/main/remote/**'
      - 'src/main/pairing-*.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/main/remote/**'
      - 'src/main/pairing-*.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol (JVM + desktop interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The interop tests run the desktop's relay host / pairing code through esbuild + node. They
      # need tweetnacl, ws and esbuild — not Electron or a rebuilt node-pty, hence no scripts.
      - name: Install desktop dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: tmux (SSH transport tests run a real, sandboxed tmux)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Protocol tests
        working-directory: android
        run: ./gradlew -p protocol test --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: protocol-test-report
          path: android/protocol/build/reports/tests/test

  app:
    name: App (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nodeterm-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
