name: Android

# The Android companion (android/): the pure-Kotlin protocol module, tested against this repo's own
# desktop host code, and the Compose app built against the Android SDK the runner ships.
on:
  push:
    paths:
      - 'android/**'
      - 'src/main/remote/**'
      - 'src/main/pairing-*.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/main/remote/**'
      - 'src/main/pairing-*.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol (JVM + desktop interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The interop tests run the desktop's relay host / pairing code through esbuild + node. They
      # need tweetnacl, ws and esbuild, not a rebuilt node-pty, hence no scripts. They do not need
      # Electron either: InteropHarness aliases `electron` to a stub
      # (android/protocol/src/test/interop/electron-stub.ts), because the real package's first
      # `require` downloads the ~110 MB Electron binary when it is not there yet, as on a fresh
      # runner, inside the harness's 20 s ready wait (audit A60).
      - name: Install desktop dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: tmux (SSH transport tests run a real, sandboxed tmux)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Protocol tests
        working-directory: android
        run: ./gradlew -p protocol test --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: protocol-test-report
          path: android/protocol/build/reports/tests/test

  app:
    name: App (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nodeterm-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # R8 runs only for the release build type, and the debug APK above is the one distributed. Building
  # the release here (unsigned; no signing secrets exist or are needed) makes a missing -dontwarn in
  # app/proguard-rules.pro fail CI instead of the first real release (audit A37): R8 reports the missing
  # class. It reports no missing -keep, so tools/check-r8-output.sh then checks that the keeps it names
  # matched (the WebView bridge, the worker, BouncyCastle's provider tables, one exception name). A NEW
  # reflection target without a keep is not detected: it needs its own keep and a line in that script.
  # A separate job so an R8 failure never withholds the debug APK. Green does not prove reflection-loaded
  # code works on a phone.
  app-release:
    name: App release (R8, unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK (R8)
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Check the R8 keeps matched
        working-directory: android
        run: sh tools/check-r8-output.sh app/build/outputs/mapping/release

      # On a missing-class failure R8 writes the -dontwarn lines it wanted to missing_rules.txt here.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-release-outputs
          path: android/app/build/outputs/mapping/release
          if-no-files-found: ignore
